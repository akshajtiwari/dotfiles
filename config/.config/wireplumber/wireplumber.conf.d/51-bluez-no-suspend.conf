# Keep Bluetooth audio nodes awake when idle.
# By default WirePlumber suspends a node after 5 s of silence, which releases the A2DP
# transport; resuming playback then takes ~3 s to renegotiate before sound comes out.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
